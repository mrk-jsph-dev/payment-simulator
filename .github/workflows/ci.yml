name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PaymentSimulator.slnx

      - name: Build
        run: dotnet build PaymentSimulator.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test PaymentSimulator.slnx --no-build --configuration Release
